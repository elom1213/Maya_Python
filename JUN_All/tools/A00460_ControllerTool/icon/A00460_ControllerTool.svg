<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- A00460_ControllerTool shelf icon: cube outline controls on a bone chain -->
  <rect x="1" y="1" width="30" height="30" rx="6" fill="#2d2d30" stroke="#4a4a4f" stroke-width="1.5"/>
  <!-- bone, drawn first so the cubes sit on top of it. The cubes are filled with
       the background colour, so only the span between them shows - that gap is
       what makes the chain read, so keep the cubes small enough to leave one. -->
  <path d="M10 22 L23.5 9" fill="none" stroke="#8fb8de"
        stroke-width="2.8" stroke-linecap="round"/>
  <!-- cube controls (isometric wireframe: hex silhouette + 3 spokes),
       stepping down in size along the chain -->
  <g stroke="#ffd23f" stroke-linejoin="round" stroke-linecap="round">
    <polygon points="10,16.2 15.02,19.1 15.02,24.9 10,27.8 4.98,24.9 4.98,19.1"
             fill="#2d2d30" stroke-width="1.9"/>
    <g fill="none" stroke-width="1.6">
      <path d="M10 22 L10 16.2"/>
      <path d="M10 22 L4.98 24.9"/>
      <path d="M10 22 L15.02 24.9"/>
    </g>
    <polygon points="23.5,5.2 26.79,7.1 26.79,10.9 23.5,12.8 20.21,10.9 20.21,7.1"
             fill="#2d2d30" stroke-width="1.7"/>
    <g fill="none" stroke-width="1.4">
      <path d="M23.5 9 L23.5 5.2"/>
      <path d="M23.5 9 L20.21 10.9"/>
      <path d="M23.5 9 L26.79 10.9"/>
    </g>
  </g>
</svg>
