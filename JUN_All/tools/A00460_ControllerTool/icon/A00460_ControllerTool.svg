<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- A00460_ControllerTool shelf icon: FK control rings around a bone chain -->
  <rect x="1" y="1" width="30" height="30" rx="6" fill="#2d2d30" stroke="#4a4a4f" stroke-width="1.5"/>
  <!-- bone chain, bottom-left to top-right -->
  <path d="M9.5 23 L16.5 16 L23.5 9" fill="none" stroke="#8fb8de"
        stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- FK control curves : circles around the bone axis. Two of them, with a
       strong size step so the chain hierarchy reads at 32 px. Kept inside the
       rounded corners - a bigger ring gets clipped bottom-left. -->
  <g fill="none" stroke="#ffd23f" stroke-linecap="round">
    <ellipse cx="9.5" cy="23" rx="6.6" ry="3.1" transform="rotate(45 9.5 23)"
             stroke-width="2.6"/>
    <ellipse cx="16.5" cy="16" rx="4.6" ry="2.2" transform="rotate(45 16.5 16)"
             stroke-width="2.2"/>
  </g>
  <!-- joints (the top one is left bare, so the chain reads as continuing) -->
  <g fill="#e8edf2">
    <circle cx="9.5" cy="23" r="2.1"/>
    <circle cx="16.5" cy="16" r="1.7"/>
    <circle cx="23.5" cy="9" r="1.5"/>
  </g>
</svg>
