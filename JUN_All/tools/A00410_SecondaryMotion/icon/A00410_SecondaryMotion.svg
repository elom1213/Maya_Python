<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- A00410_SecondaryMotion shelf icon: a joint chain with follow-through.
       The root bead is filled (fully driven by the parent), the links swing out and
       the tip CURLS BACK - that whip silhouette is the lag this tool bakes.
       32px notes: bold links + big beads only. Thin strokes, dashes and a faint
       "rest pose" line were all tried and dropped - dashes speckle at this size and
       the vertical rest line read as a pin/handle stuck to the root bead. -->
  <rect x="1" y="1" width="30" height="30" rx="6" fill="#2d2d30" stroke="#4a4a4f" stroke-width="1.5"/>

  <!-- links -->
  <path d="M9 8.5 L15.5 12 L20 17.5 L17.5 24.5"
        fill="none" stroke="#ff9e64" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- joints: root filled, the rest hollow beads -->
  <circle cx="9" cy="8.5" r="2.5" fill="#ff9e64"/>
  <g fill="#2d2d30" stroke="#ff9e64" stroke-width="1.7">
    <circle cx="15.5" cy="12" r="2.4"/>
    <circle cx="20" cy="17.5" r="2.4"/>
    <circle cx="17.5" cy="24.5" r="2.4"/>
  </g>
</svg>
