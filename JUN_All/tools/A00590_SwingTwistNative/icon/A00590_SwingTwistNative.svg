  <circle cx="8" cy="25" r="2.6" fill="#b48cff"/>
  <!-- twist: 뼈 축을 감는 화살표 -->
  <ellipse cx="17" cy="16" rx="6" ry="2.6" transform="rotate(-45 17 16)" fill="none" stroke="#ffb347" stroke-width="1.7"/>
  <path d="M22.2 14.2 l2.6 -0.4 l-0.9 2.5 z" fill="#ffb347"/>
