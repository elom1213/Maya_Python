<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- A00470_MaterialTool shelf icon: a material ball with a name tag.
       Two elements only - at 32px a third one turns to mush. -->
  <rect x="1" y="1" width="30" height="30" rx="6" fill="#2d2d30" stroke="#4a4a4f" stroke-width="1.5"/>
  <!-- material ball (the shading sphere everyone recognises) -->
  <circle cx="13" cy="12.5" r="8" fill="#8fb8de"/>
  <circle cx="10" cy="9.5" r="2.4" fill="#dbeaf7"/>
  <!-- name tag, drawn on top so the two read as one object -->
  <path d="M15 20.5 L24.5 20.5 L29 25 L24.5 29.5 L15 29.5 Z"
        fill="#ffd23f" stroke="#2d2d30" stroke-width="1.4" stroke-linejoin="round"/>
  <circle cx="19" cy="25" r="1.5" fill="#2d2d30"/>
</svg>
