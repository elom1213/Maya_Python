<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- A00380_MeshTool shelf icon
       세 가지를 한 그림에 담는다 :
         mesh   - 원근으로 누운 와이어프레임 격자 (이 툴이 다루는 대상)
         arrow  - 한 버텍스를 노말 방향으로 끌어올리는 화살표 (Peak / Match = 편집)
         badge  - 십자 배지 (MeshDoctor = 진단·수정)
       32px 에서 뭉개지지 않도록 요소는 셋뿐이고, 배지는 겹치지 않게 오른쪽 아래 모서리에 둔다. -->

  <rect x="1" y="1" width="30" height="30" rx="6" fill="#2d2d30" stroke="#4a4a4f" stroke-width="1.5"/>

  <!-- 누운 메시 격자 -->
  <g stroke="#ff9e64" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M2.5 16 L13 10.5 L23.5 16 L13 21.5 Z"/>
    <path d="M2.5 16 L23.5 16"/>
    <path d="M13 10.5 L13 21.5"/>
  </g>

  <!-- 격자의 버텍스 -->
  <g fill="#ffc9a3">
    <circle cx="2.5" cy="16" r="1.3"/>
    <circle cx="23.5" cy="16" r="1.3"/>
    <circle cx="13" cy="21.5" r="1.3"/>
    <circle cx="13" cy="16" r="1.3"/>
  </g>

  <!-- 끌어올리는 버텍스 + 노말 방향 화살표 -->
  <circle cx="13" cy="10.5" r="1.9" fill="#f2f5f8"/>
  <g stroke="#f2f5f8" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M13 8.2 L13 3.6"/>
    <path d="M10.4 6 L13 3.2 L15.6 6"/>
  </g>

  <!-- 진단 배지 -->
  <g>
    <circle cx="24.3" cy="24.3" r="6.4" fill="#ee5253" stroke="#2d2d30" stroke-width="1.2"/>
    <rect x="20.7" y="23.4" width="7.2" height="1.8" rx="0.9" fill="#ffffff"/>
    <rect x="23.4" y="20.7" width="1.8" height="7.2" rx="0.9" fill="#ffffff"/>
  </g>
</svg>
