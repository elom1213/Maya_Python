<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <rect x="1" y="1" width="30" height="30" rx="6" fill="#2d2d30" stroke="#4a4a4f" stroke-width="1.5"/>
  <!-- 템플릿 조인트 체인 (가이드) -->
  <g stroke="#8a94a6" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="2 2">
    <line x1="9" y1="25" x2="16" y2="16"/>
    <line x1="16" y1="16" x2="23" y2="7"/>
  </g>
  <!-- 컨트롤러(케이지) 링 : 조인트 자리로 맞춰진다 -->
  <g fill="none" stroke="#e8b84b" stroke-width="1.8">
    <circle cx="9" cy="25" r="4"/>
    <circle cx="23" cy="7" r="4"/>
  </g>
  <!-- 매칭 지점 -->
  <g fill="#e8b84b">
    <circle cx="9" cy="25" r="1.6"/>
    <circle cx="16" cy="16" r="1.6"/>
    <circle cx="23" cy="7" r="1.6"/>
  </g>
</svg>
